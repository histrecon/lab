    .navigation-module {

        top: 0;

        right: 0;

        height: 32px;
        flex-shrink: 0;
        white-space: nowrap;
        z-index: 10;
    }

    .nav-logo:hover {

        transform: translateY(-1px);
    }

    /* ============================================================
       БУРГЕР-КНОПКА — по умолчанию скрыта на десктопе
       ============================================================ */

    .burger-btn {
        display: none;
        flex-direction: column;
        justify-content: space-between;
        width: 28px;
        height: 20px;
        background: transparent;
        border: none;

        padding: 0;
        z-index: 10;

    }

    .burger-btn:hover {
        opacity: 0.8;
    }

    .burger-btn:focus {
        outline: 2px solid #e6a336;
        outline-offset: 4px;
    }

    .burger-line {
        display: block;
        width: 100%;
        height: 2.5px;
        background: #f5ebd8;
        border-radius: 2px;
        transition: all 0.3s ease;
        transform-origin: center;
    }

    /* Анимация бургера → крестик */
    .burger-btn.active .burger-line:nth-child(1) {
        transform: translateY(8.5px) rotate(45deg);
    }

    .burger-btn.active .burger-line:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
    }

    .burger-btn.active .burger-line:nth-child(3) {
        transform: translateY(-8.5px) rotate(-45deg);
    }

    /* ============================================================
       МЕНЮ — по умолчанию видно на десктопе
       ============================================================ */

    .nav-menu {
        display: flex;

        align-items: center;
        height: 100%;
        flex-wrap: wrap;
        justify-content: flex-end;

        transform: translateY(-1px);

       ОВЕРЛЕЙ
       ============================================================ */

        left: 0;
        right: 0;

        background: rgba(0, 0, 0, 0.5);

    }

        pointer-events: auto;
    }

    /* ============================================================
       МОДАЛЬНОЕ ОКНО ДОНАТА
       ============================================================ */

    .donate-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;

        height: 100%;
        background-color: rgba(0,0,0,0.7);
        backdrop-filter: blur(4px);
        align-items: center;
        justify-content: center;
    }

    #donateToggle:checked ~ .donate-modal {

    }

    .donate-modal-content {
        background: #2a1f14;

    @keyframes modalFadeIn {
        from { opacity: 0; transform: scale(0.95) translateY(-20px); }

    .donate-close {

    }

    /* ============================================================
       ТЕЛЕФОНЫ (до 768px) — БУРГЕР ВКЛЮЧАЕТСЯ
       ============================================================ */

    @media (max-width: 768px) {

            flex-wrap: nowrap;
            gap: 6px;
        }

        }

        /* === БУРГЕР ПОЯВЛЯЕТСЯ === */
        .burger-btn {
            display: flex !important;
        }

        /* === МЕНЮ СКРЫВАЕТСЯ (выезжает справа) === */
        .nav-menu {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 280px;
            max-width: 80vw;
            background: rgba(30, 20, 10, 0.98);
            flex-direction: column;
            align-items: stretch;
            padding: 70px 20px 30px;
            gap: 4px;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);

            justify-content: flex-start;
            flex-wrap: nowrap;
            border-left: 2px solid #d4a574;

            display: flex !important;
        }

        /* === МЕНЮ ОТКРЫТО === */
        .nav-menu.open {
            transform: translateX(0);
        }

        .nav-menu-item {
            font-size: 1rem;
            padding: 14px 16px;
            height: auto;
            border-radius: 8px;
            border: 1px solid transparent;
            justify-content: flex-start;
            width: 100%;
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-menu-item span:first-child {
            font-size: 1.2rem;
            min-width: 30px;
        }

        .nav-menu-item span:last-child {
            font-size: 1rem;
        }

        .nav-menu-item:hover {
            background: rgba(230, 163, 54, 0.15);
            border-color: #d4a574;
            transform: none;
        }

        .nav-menu-item.active {
            background: linear-gradient(135deg, #e6a336, #d1891c);
            color: #333;
            border-color: #c17e1a;
        }

        .feedback-btn {
            background: linear-gradient(135deg, #e6a336, #d1891c);
            color: #333;
            border-color: #c17e1a;
            font-weight: 700;
            margin-top: 6px;
        }

        .feedback-btn:hover {
            background: linear-gradient(135deg, #d1891c, #b8731a);
            color: #333;
            transform: none;
        }

        .donate-btn {
            font-size: 1rem;
            padding: 14px 16px;
            height: auto;
            justify-content: flex-start;
            border-radius: 8px;
            margin-top: 4px;
            border: 1px solid #ff6b6b;
        }

        .donate-btn span:first-child {
            font-size: 1.2rem;
            min-width: 30px;
        }

        .donate-btn span:last-child {
            font-size: 1rem;
        }

        .donate-btn:hover {
            transform: none;
        }

        .donate-modal-content {
            padding: 20px;
        }

    /* ============================================================
       МАЛЕНЬКИЕ ТЕЛЕФОНЫ (до 480px)
       ============================================================ */

    @media (max-width: 480px) {
        .navigation-module {
            min-height: 48px;
            padding: 4px 8px;
        }

            font-size: 0.8rem;

            gap: 4px;
        }

        .nav-logo span:first-child {

        .burger-btn.active .burger-line:nth-child(3) {

            width: 260px;

</style>

<script>
    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ БУРГЕР-МЕНЮ (глобальная функция)
    // ============================================================

    window.initBurgerMenu = function() {
        var burgerBtn = document.getElementById('burgerBtn');
        var navMenu = document.getElementById('navMenu');
        var overlay = document.getElementById('navOverlay');

        if (!burgerBtn || !navMenu) {
            console.warn('⚠️ Бургер или меню не найдены');
            return;
        }

        console.log('🍔 Инициализация бургер-меню...');

        var isOpen = false;

        function toggleMenu() {
            isOpen = !isOpen;
            navMenu.classList.toggle('open', isOpen);
            burgerBtn.classList.toggle('active', isOpen);
            if (overlay) {
                overlay.classList.toggle('active', isOpen);
            }
            document.body.style.overflow = isOpen ? 'hidden' : '';
            console.log('🍔 Меню ' + (isOpen ? 'ОТКРЫТО' : 'ЗАКРЫТО'));
        }

        function closeMenu() {
            if (isOpen) {
                isOpen = false;
                navMenu.classList.remove('open');
                burgerBtn.classList.remove('active');
                if (overlay) {
                    overlay.classList.remove('active');
                }
                document.body.style.overflow = '';
            }
        }

        // === НАВЕШИВАЕМ СОБЫТИЯ ===

        // 1. Клик по бургеру
        burgerBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMenu();
        });

        // 2. Клик по оверлею
        if (overlay) {
            overlay.addEventListener('click', closeMenu);
        }

        // 3. Клик по пунктам меню — закрываем
        var menuItems = navMenu.querySelectorAll('.nav-menu-item, .donate-btn');
        menuItems.forEach(function(item) {
            item.addEventListener('click', function() {
                if (this.tagName === 'A') {
                    setTimeout(closeMenu, 150);
                } else {
                    closeMenu();
                }
            });
        });

        // 4. Закрытие по ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeMenu();
            }
        });

        // 5. Закрытие при изменении размера окна
        var resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (window.innerWidth > 768 && isOpen) {
                    closeMenu();
                }
            }, 200);
        });

        console.log('✅ Бургер-меню готово');
    };

    // Если DOM уже загружен, инициализируем сразу
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(window.initBurgerMenu, 50);
    } else {
        document.addEventListener('DOMContentLoaded', window.initBurgerMenu);
    }

    // === ПОДСВЕТКА АКТИВНОЙ СТРАНИЦЫ ===
    (function() {
        var currentPage = window.location.pathname.split('/').pop() || 'index.html';
        if (currentPage.includes('?')) currentPage = currentPage.split('?')[0];
        if (currentPage.includes('#')) currentPage = currentPage.split('#')[0];
        
        var navItems = document.querySelectorAll('.nav-menu-item');
        for (var i = 0; i < navItems.length; i++) {
            var href = navItems[i].getAttribute('href');
            if (href === currentPage) {
                navItems[i].classList.add('active');
            }
        }
    })();

    // === МОДАЛКА ДОНАТА ===
    (function() {
        var modal = document.querySelector('.donate-modal');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    document.getElementById('donateToggle').checked = false;
                }
            });
        }
    })();

    console.log('🎯 Навигация инициализирована полностью');
</script>
