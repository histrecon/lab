<style>
    /* ============================================================
       НАВИГАЦИЯ
       ============================================================ */

    .navigation-module {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(30, 20, 10, 0.95);
        border-bottom: 2px solid #d4a574;
        z-index: 999;
        padding: 8px 15px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.4);
        min-height: 60px;
        display: flex;
        align-items: center;
    }

    .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        gap: 12px;
        position: relative;
    }

    .nav-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        color: #e6a336;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        padding: 6px 10px;
        border: 1px solid #d4a574;
        border-radius: 8px;
        background: rgba(139, 69, 19, 0.2);
        transition: all 0.3s;
        flex-shrink: 0;
        white-space: nowrap;
        z-index: 10;
        min-width: 60px;
    }

    .nav-logo span:first-child {
        font-size: 1.4rem;
    }
    .nav-logo span:last-child {
        font-size: 0.7rem;
        opacity: 0.8;
    }

    .nav-logo:hover {
        background: rgba(230, 163, 54, 0.2);
        transform: translateY(-2px);
    }

    /* ============================================================
       МЕНЮ — ВСЕГДА ДВЕ ВЕРТИКАЛЬНЫЕ КОЛОНКИ
       ============================================================ */

    .nav-menu {
        display: flex;
        flex-direction: row;
        gap: 12px;
        align-items: stretch;
        justify-content: flex-end;
        flex: 1;
    }

    .nav-column {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: stretch;
        justify-content: center;
    }

    .nav-column:first-child {
        align-items: flex-end;
    }

    .nav-column:last-child {
        align-items: flex-start;
    }

    .nav-menu-item {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #f5ebd8;
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 6px;
        transition: all 0.3s;
        font-weight: 600;
        font-size: 0.9rem;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
        width: 100%;
        justify-content: center;
    }

    .nav-menu-item:hover {
        background: rgba(230, 163, 54, 0.2);
        color: #ffcc66;
        border-color: #d4a574;
        transform: translateY(-1px);
    }

    .nav-menu-item.active {
        background: linear-gradient(135deg, #e6a336, #d1891c);
        color: #333;
        border-color: #c17e1a;
    }

    .nav-menu-item span:first-child {
        font-size: 1.1rem;
        min-width: 24px;
    }

    .feedback-btn {
        background: linear-gradient(135deg, #e6a336, #d1891c);
        color: #333;
        border-color: #c17e1a;
        font-weight: 700;
    }

    .feedback-btn:hover {
        background: linear-gradient(135deg, #d1891c, #b8731a);
        color: #333;
        transform: translateY(-1px);
    }

    .donate-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #ff8a8a;
        background: rgba(255, 50, 50, 0.15);
        border: 1px solid #ff6b6b;
        border-radius: 6px;
        padding: 6px 14px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s;
        font-family: inherit;
        text-decoration: none;
        width: 100%;
        justify-content: center;
        white-space: nowrap;
    }

    .donate-btn span:first-child {
        font-size: 1.1rem;
        min-width: 24px;
    }

    .donate-btn:hover {
        background: rgba(255, 50, 50, 0.3);
        color: #ff4444;
        border-color: #ff4444;
        transform: translateY(-1px);
    }

    /* ============================================================
       МОДАЛЬНОЕ ОКНО ДОНАТА
       ============================================================ */

    .donate-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.7);
        backdrop-filter: blur(4px);
        align-items: center;
        justify-content: center;
    }

    #donateToggle:checked ~ .donate-modal {
        display: flex;
    }

    .donate-modal-content {
        background: #2a1f14;
        padding: 30px 35px;
        border: 2px solid #d4a574;
        border-radius: 16px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        position: relative;
        animation: modalFadeIn 0.3s ease;
    }

    @keyframes modalFadeIn {
        from { opacity: 0; transform: scale(0.95) translateY(-20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .donate-close {
        position: absolute;
        top: 10px;
        right: 18px;
        font-size: 28px;
        color: #bbb;
        cursor: pointer;
        transition: color 0.2s;
        line-height: 1;
        display: block;
    }

    .donate-close:hover {
        color: #fff;
    }

    .donate-modal-content h3 {
        color: #f5ebd8;
        font-size: 1.5rem;
        margin: 0 0 8px 0;
    }

    .donate-modal-content p {
        color: #ccc;
        font-size: 1rem;
        margin: 0 0 20px 0;
    }

    .donate-options {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .donate-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        background: rgba(230, 163, 54, 0.15);
        border: 1px solid #d4a574;
        border-radius: 10px;
        color: #f5ebd8;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s;
        min-width: 100px;
        justify-content: center;
    }

    .donate-option:hover {
        background: rgba(230, 163, 54, 0.3);
        border-color: #e6a336;
        transform: translateY(-2px);
        color: #ffcc66;
    }

    /* ============================================================
       АДАПТИВНОСТЬ — для маленьких экранов (уменьшаем шрифты)
       ============================================================ */

    @media (max-width: 768px) {
        .navigation-module {
            min-height: 56px;
            padding: 6px 10px;
        }

        .nav-container {
            gap: 8px;
        }

        .nav-logo {
            padding: 4px 8px;
            min-width: 50px;
        }
        .nav-logo span:first-child {
            font-size: 1.2rem;
        }
        .nav-logo span:last-child {
            font-size: 0.6rem;
        }

        .nav-menu {
            gap: 8px;
        }

        .nav-column {
            gap: 3px;
        }

        .nav-menu-item {
            font-size: 0.75rem;
            padding: 4px 10px;
            gap: 4px;
        }
        .nav-menu-item span:first-child {
            font-size: 0.9rem;
            min-width: 20px;
        }

        .donate-btn {
            font-size: 0.75rem;
            padding: 4px 10px;
            gap: 4px;
        }
        .donate-btn span:first-child {
            font-size: 0.9rem;
            min-width: 20px;
        }
    }

    @media (max-width: 480px) {
        .navigation-module {
            min-height: 50px;
            padding: 4px 6px;
        }

        .nav-container {
            gap: 4px;
        }

        .nav-logo {
            padding: 3px 5px;
            min-width: 40px;
        }
        .nav-logo span:first-child {
            font-size: 1rem;
        }
        .nav-logo span:last-child {
            font-size: 0.5rem;
        }

        .nav-menu {
            gap: 4px;
        }

        .nav-column {
            gap: 2px;
        }

        .nav-menu-item {
            font-size: 0.6rem;
            padding: 3px 6px;
            gap: 3px;
            border-radius: 4px;
        }
        .nav-menu-item span:first-child {
            font-size: 0.7rem;
            min-width: 16px;
        }

        .donate-btn {
            font-size: 0.6rem;
            padding: 3px 6px;
            gap: 3px;
            border-radius: 4px;
        }
        .donate-btn span:first-child {
            font-size: 0.7rem;
            min-width: 16px;
        }

        .donate-modal-content {
            padding: 20px;
        }

        .donate-options {
            gap: 12px;
        }

        .donate-option {
            padding: 10px 16px;
            font-size: 0.9rem;
            min-width: 80px;
        }
    }

    @media (max-width: 360px) {
        .nav-logo span:first-child {
            font-size: 0.8rem;
        }
        .nav-logo span:last-child {
            font-size: 0.4rem;
        }

        .nav-menu-item {
            font-size: 0.5rem;
            padding: 2px 4px;
            gap: 2px;
        }
        .nav-menu-item span:first-child {
            font-size: 0.6rem;
            min-width: 14px;
        }

        .donate-btn {
            font-size: 0.5rem;
            padding: 2px 4px;
            gap: 2px;
        }
        .donate-btn span:first-child {
            font-size: 0.6rem;
            min-width: 14px;
        }
    }
</style>

<script>
    (function() {
        'use strict';

        // === ПОДСВЕТКА АКТИВНОЙ СТРАНИЦЫ ===
        var currentPage = window.location.pathname.split('/').pop() || 'index.html';
        if (currentPage.includes('?')) currentPage = currentPage.split('?')[0];
        if (currentPage.includes('#')) currentPage = currentPage.split('#')[0];
        
        var navItems = document.querySelectorAll('.nav-menu-item');
        for (var i = 0; i < navItems.length; i++) {
            var href = navItems[i].getAttribute('href');
            if (href === currentPage) {
                navItems[i].classList.add('active');
            }
        }

        // === МОДАЛКА ДОНАТА ===
        var modal = document.querySelector('.donate-modal');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    document.getElementById('donateToggle').checked = false;
                }
            });
        }

        // === ЗАКРЫТИЕ ДОНАТА ПО ESC ===
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('donateToggle').checked = false;
            }
        });

        console.log('✅ Навигация загружена (всегда две вертикальные колонки)');
    })();
</script>
